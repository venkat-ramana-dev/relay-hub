spring:
  application:
    name: relayhub

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:postgresql://localhost:5434/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  flyway:
    enabled: true
    locations: "classpath:db/migration"
    baseline-on-migrate: true

  data:
    web:
      pageable:
        default-page-size: 50
        max-page-size: 100

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

relayhub:
  worker:
    poll-interval: 5000
    batch-size: 10
    processing-recovery-interval: 120000
    processing-timeout: 5m

  bootstrap:
    admin:
      email: ${RELAYHUB_ADMIN_EMAIL:admin@relayhub.dev}
      password: ${RELAYHUB_ADMIN_PASSWORD:admin123}

  notification:
    max-retries: 5