spring:
  application:
    name: relayhub

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:postgresql://localhost:5434/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: "classpath:db/migration"
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

relayhub:
  worker:
    poll-interval: 5000
    batch-size: 10
    processing-recovery-interval: 120000
    processing-timeout: 5m

  bootstrap:
    admin:
      email: ${RELAYHUB_ADMIN_EMAIL:admin@relayhub.dev}
      password: ${RELAYHUB_ADMIN_PASSWORD:admin123}

  notification:
    max-retries: 5