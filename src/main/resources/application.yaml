spring:
  application:
    name: relayhub

  datasource:
    url: jdbc:postgresql://localhost:5432/relay_hub
    username: postgres
    password: postgres

    jpa:
      hibernate:
        ddl-auto: validate
      show-sql: true
      properties:
        hibernate:
          format_sql: true

    flyway:
      enabled: true
      locations: classpath:db/migration
      baseline-on-migrate: true